worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;

  server {
    listen      8080;
    server_name localhost;

    root "C:/Users/Sandip Shakya/Projects/collecto/dist";
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Serve images and expose directory listings as JSON so the gallery
    # can discover new files dropped under /images/ at runtime, with no
    # rebuild required. autoindex only fires for directory requests; file
    # requests still serve the file normally.
    location /images/ {
      autoindex on;
      autoindex_format json;
      add_header Cache-Control "no-store" always;
    }
  }
}
